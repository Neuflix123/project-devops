name: smart-city-backend

services:
  db:
    image: mysql:8.0
    container_name: smartcity-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: smart_city_db
    volumes:
      - dbdata:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: neuflix123/smart-city-backend:latest
    build: .
    container_name: smartcity-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpass
      DB_NAME: smart_city_db
      JWT_SECRET: rahasia_negara_smart_city
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  dbdata:
  uploads: