<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart City Backend</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    .ok { color: #0a7d2c; font-weight: bold; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Smart City Backend</h1>
  <p>API pelaporan masalah kota (pengguna dan laporan) yang berjalan di dalam container.</p>
  <p>Status server: <span class="ok">Berjalan</span></p>
  <h3>Cara penggunaan</h3>
  <ul>
    <li>Registrasi dan login pengguna lewat endpoint API.</li>
    <li>Pengguna yang sudah login dapat membuat dan melihat laporan.</li>
  </ul>
  <p>Versi container: <code>v1</code></p>
</body>
</html>
